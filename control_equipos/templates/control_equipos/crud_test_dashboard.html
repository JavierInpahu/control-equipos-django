<!DOCTYPE html>
<html>
<head>
    <title>CRUD Test Dashboard</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #2b0a3d, #1a0b2e);
            font-family: Arial, sans-serif;
            color:white;
        }

        .card{
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(179,107,255,0.25);
            padding: 28px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 0 25px rgba(179,107,255,0.15);
        }

        .title{
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:#c084fc;
            margin-bottom:18px;
            letter-spacing:1px;
        }

        .row{
            margin:8px 0;
            text-align:center;
        }

        .label{
            color:#d8b4fe;
            font-weight:bold;
        }

        .ok{
            color:#7CFF9B;
            font-weight:bold;
        }

        .btn{
            display:block;
            margin:18px auto 0;
            padding:10px 14px;
            background:#7c3aed;
            color:white;
            text-align:center;
            border-radius:10px;
            text-decoration:none;
            width:120px;
            font-weight:bold;
        }

        .btn:hover{
            background:#9b5cff;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="title">CRUD TEST DASHBOARD</div>

    <div class="row"><span class="label">CREATE:</span> <span class="ok">ok</span></div>

    <br>

    <div class="row"><span class="label">READ:</span> <span class="ok">ok</span></div>

    <br>

    <div class="row"><span class="label">UPDATE:</span> <span class="ok">ok</span></div>

    <br>

    <div class="row"><span class="label">DELETE:</span> <span class="ok">ok</span></div>

    <br>

    <div class="row"><span class="label">STATUS:</span> <span class="ok">ok</span></div>

    <a class="btn" href="?reset=1">RESET TEST</a>

</div>

</body>
</html>
