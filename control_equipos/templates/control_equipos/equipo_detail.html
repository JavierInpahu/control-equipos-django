<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Equipo</title>

    <style>
        body{
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg,#f4f6f9,#e9eef5);
            margin: 0;
            padding: 0;
        }

        .card{
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        h2{
            text-align: center;
            color: #333;
        }

        p{
            background: #f8f9fb;
            padding: 10px;
            border-radius: 8px;
        }

        a{
            display: block;
            text-align: center;
            margin-top: 20px;
            background: #2575fc;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
        }

        @media(max-width:768px){

            .card{
                width: 95%;
                padding: 20px;
            }

            h2{
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <h2>{{ object.marca }}</h2>

    <p><b>Tipo:</b> {{ object.tipo }}</p>

    <p><b>Serial:</b> {{ object.serial }}</p>

    <p><b>Estado:</b> {{ object.estado }}</p>

    <p><b>Fecha solicitud:</b> {{ object.fecha_solicitud }}</p>

    <p><b>Persona responsable:</b> {{ object.nombre_estudiante }}</p>

    <p><b>Número estudiante:</b> {{ object.numero_estudiante }}</p>

    <a href="{% url 'equipo_list' %}">
        ⬅ Volver
    </a>

</div>

</body>
</html>
