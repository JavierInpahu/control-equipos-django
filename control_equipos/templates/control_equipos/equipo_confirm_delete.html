<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Equipo</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
        }

        .card{
            width:90%;
            max-width:500px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,.1);
            text-align:center;
        }

        button{
            background:#dc3545;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        a{
            margin-left:10px;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Eliminar equipo</h2>

    <p>
        ¿Está seguro de eliminar
        <b>{{ object.marca }}</b>?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

        <a href="{% url 'equipo_list' %}">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
