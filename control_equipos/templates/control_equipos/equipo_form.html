<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Equipo</title>

    <style>

        body{
            font-family:'Segoe UI',Arial,sans-serif;
            background:linear-gradient(135deg,#eef2f7,#dfe9f3);
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            max-width:500px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.12);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        form p{
            margin-bottom:15px;
        }

        label{
            font-weight:bold;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:15px;
            background:#2575fc;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            opacity:0.9;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
        }

        @media(max-width:768px){

            .container{
                width:95%;
                padding:20px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Formulario de Equipo</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>

    </form>

    <a class="back" href="{% url 'equipo_list' %}">
        ⬅ Volver al listado
    </a>

</div>

</body>
</html>
